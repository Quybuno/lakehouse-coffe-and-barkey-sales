# Stack thống nhất: real-time (MySQL, Kafka, Connect, Redis) + batch (Spark, Airflow, Postgres metadata, MinIO).
# Chạy: docker compose up -d
#
# MySQL: nếu không có file .env, mật khẩu root mặc định là localdev_mysql_root (đổi bằng MYSQL_PASSWORD
# hoặc MYSQL_ROOT_PASSWORD trong .env). Volume MySQL cũ đã khởi tạo với mật khẩu khác → trùng .env hoặc xóa volume.

# Chỉ spark-master build image Spark — tránh bake song song cùng tag (lỗi "image already exists" / pipe closed).
x-spark-common: &spark-common
  image: kd-spark:3.5.5-python3.11
  volumes:
    # Project giữ :ro để code không bị task ghi đè. tmp/ overlay rw riêng cho shuffle/warehouse scratch.
    # Log: script Python đã đổi sang stdout → không cần mount rw cho logs/.
    - .:/opt/spark/work-dir/project:ro
    - ./tmp:/opt/spark/work-dir/project/tmp:rw
  networks:
    - kd_network

# Chỉ airflow-init build image Airflow — tránh `docker compose build` 3 service cùng Dockerfile
# (BuildKit bake: "failed to execute bake: read |0: file already closed").
x-airflow-common: &airflow-common
  image: kd-airflow:2.8.0-python3.11-spark355
  # Tag kd-* chỉ tồn tại sau khi build local — không pull từ Docker Hub (tránh "pull access denied").
  pull_policy: never
  # Load secrets from repo .env into the container. Do not also set MYSQL_PASSWORD in `environment`
  # with empty ${...:-} — that would override this file and wipe the password.
  env_file:
    - path: .env
      required: false
  environment:
    TZ: Asia/Ho_Chi_Minh
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhxpXr8hdLAcAlcpXfME6P5bGLo=}"
    # Same value on scheduler, webserver, workers — avoids 403 when fetching logs from task hosts.
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:-dev-airflow-webserver-secret-key-min-32-chars-long}"
    AIRFLOW_PROJECT_DIR: /opt/airflow/project
    MYSQL_HOST: ${MYSQL_HOST:-mysql}
    MYSQL_PORT: "${MYSQL_PORT:-3306}"
    # Tránh user/database rỗng trong Airflow → JDBC "Access denied for user ''"
    # Phải luôn có giá trị (không dùng ${VAR:-} rỗng): Spark / JDBC cần mật khẩu; không có .env thì dùng default dev.
    MYSQL_USER: ${MYSQL_USER:-root}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-localdev_mysql_root}}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-kd_bakery_coffee}
    KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}"
    # Spark s3a → MinIO (phải có trong container, không chỉ trong .env trên host)
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze-raw}
    MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
    MINIO_GOLD_BUCKET: ${MINIO_GOLD_BUCKET:-gold}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - .:/opt/airflow/project
    # tmp/ overlay rw (uid 50000 cần ghi được, host dir có thể thuộc uid khác).
    - ./tmp:/opt/airflow/project/tmp:rw
    - ./jars:/opt/airflow/jars
    - ./logs:/opt/airflow/logger
    - ./volumes/spark-cache/.ivy2:/home/airflow/.ivy2
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - kd_network

services:
  mysql:
    image: mysql:8.0.35
    container_name: kd_bakery_mysql
    environment:
      # Cùng chuỗi mặc định với MYSQL_PASSWORD của Airflow khi không có .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-localdev_mysql_root}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kd_bakery_coffee}
    ports:
      - "3306:3306"
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-row-image=FULL
      - --local-infile=1 # cho phep doc file
    volumes:
      - kd_mysql_data:/var/lib/mysql
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  adminer:
    image: adminer:4.8.1
    container_name: kd_adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "0.25"

  kafka-1:
    container_name: kafka-1
    image: 'apache/kafka:4.1.2'
    user: "0:0"
    ports:
      - '29092:29092'
    networks:
      - kd_network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "k3Fk2HhXQwWL9rPlYxYOoA"
      KAFKA_LOG_DIRS: /opt/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./volumes/kafka-1:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  kafka-2:
    container_name: kafka-2
    image: 'apache/kafka:4.1.2'
    user: "0:0"
    ports:
      - "29093:29093"
    networks:
      - kd_network
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "k3Fk2HhXQwWL9rPlYxYOoA"
      KAFKA_LOG_DIRS: /opt/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./volumes/kafka-2:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  kafka-3:
    container_name: kafka-3
    image: 'apache/kafka:4.1.2'
    user: "0:0"
    ports:
      - "29094:29094"
    networks:
      - kd_network
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "k3Fk2HhXQwWL9rPlYxYOoA"
      KAFKA_LOG_DIRS: /opt/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./volumes/kafka-3:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  init-kafka:
    image: 'apache/kafka:4.1.2'
    container_name: init-kafka
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - kd_network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS="kafka-1:9092,kafka-2:9092,kafka-3:9092"
        TOPICS=/opt/kafka/bin/kafka-topics.sh
        echo "Waiting for Kafka (3 brokers)..."
        until "$$TOPICS" --bootstrap-server "$$BS" --list >/dev/null 2>&1; do
          sleep 3
        done
        echo "Creating topics: "
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 1 --replication-factor 3 --config cleanup.policy=compact --topic connect-configs
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 12 --replication-factor 3 --config cleanup.policy=compact --topic connect-offsets
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 6 --replication-factor 3 --config cleanup.policy=compact --topic connect-status
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 1 --replication-factor 3 --config cleanup.policy=compact --topic debezium-connect-configs
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 12 --replication-factor 3 --config cleanup.policy=compact --topic debezium-connect-offsets
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 6 --replication-factor 3 --config cleanup.policy=compact --topic debezium-connect-status
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 6 --replication-factor 3 --topic mysql.kd_bakery_coffee.order_details
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 6 --replication-factor 3 --topic mysql.kd_bakery_coffee.orders
        "$$TOPICS" --create --if-not-exists --bootstrap-server "$$BS" --partitions 6 --replication-factor 3 --topic order_ready_for_checking
        echo "Topics ready."
        "$$TOPICS" --bootstrap-server "$$BS" --list
    deploy:
      resources:
        limits:
          cpus: "0.5"


  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 8000:8080
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - kd_network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"

  connect:
    image: quay.io/debezium/connect:3.2
    hostname: connect
    container_name: kafka-connect
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      mysql:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status
      ADVERTISED_HOST_NAME: localhost
      ADVERTISED_PORT: 8083
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_CONSUMER_OVERRIDE_GROUP_PROTOCOL: classic
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: always
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./volumes/redis:/data
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "0.5"

  # --- Batch / Airflow ---
  spark-master:
    <<: *spark-common
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
      target: spark
    container_name: spark-master
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "9090:8080"
    environment:
      PYSPARK_PYTHON: /usr/bin/python3.11
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3.11
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      # 2 core / 2g RAM đủ cho 6 joins của gold_layer trên dataset nhỏ.
      # Container limit đặt 2.5g để chừa headroom cho JVM overhead + Iceberg JAR.
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: /usr/bin/python3.11
      PYSPARK_DRIVER_PYTHON: /usr/bin/python3.11
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "0.5"

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
      target: airflow
    container_name: airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        airflow connections delete spark 2>/dev/null || true
        airflow connections add spark \
          --conn-type spark \
          --conn-host 'spark://spark-master' \
          --conn-port 7077 \
          --conn-extra '{"deploy-mode": "client"}'
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Scheduler cũng chạy Spark driver (deploy-mode=client) khi trigger batch job.
          # Cần 2 CPU + 2g RAM để gánh cả scheduler heartbeat + driver JVM.
          cpus: "2.0"
          memory: 2048M

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    command: ["webserver"]
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Tạo sẵn các bucket mà Iceberg/Spark cần. Chạy 1 lần rồi tự exit.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2
        done
        mc mb -p local/warehouse   2>/dev/null || true
        mc mb -p local/gold        2>/dev/null || true
        mc mb -p local/silver      2>/dev/null || true
        mc mb -p local/bronze-raw  2>/dev/null || true
        echo "buckets ready:"; mc ls local
    networks:
      - kd_network
    restart: "no"

  # Iceberg REST catalog — metadata store cho lakehouse.
  # Warehouse nằm trên bucket `warehouse` (MinIO). Không dùng HMS, không cần DB phụ.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "0.5"

  # Trino — SQL engine đọc Iceberg qua REST catalog và file qua MinIO.
  trino:
    image: trinodb/trino:447
    container_name: trino
    ports:
      - "8090:8080"
    volumes:
      - ./configs/trino/etc:/etc/trino:ro
    depends_on:
      iceberg-rest:
        condition: service_started
    networks:
      - kd_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # Trino JVM default rất tham RAM. Cap lại ở đây; cấu hình `-Xmx`
          # chi tiết nằm tại configs/trino/etc/jvm.config (khuyến nghị Xmx 768m).
          memory: 1024M

  # Streamlit dashboard — query Trino.
  streamlit:
    build:
      context: .
      dockerfile: ./scripts/dashboard/Dockerfile
    image: kd-streamlit:latest
    container_name: streamlit
    ports:
      - "8501:8501"
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: dashboard
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: gold
    volumes:
      - ./scripts/dashboard:/app
    depends_on:
      trino:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kd_network
    deploy:
      resources:
        limits:
          cpus: "0.5"

networks:
  kd_network:
    driver: bridge

volumes:
  kd_mysql_data:

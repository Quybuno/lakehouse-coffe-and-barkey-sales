# Single-node mode: coordinator đồng thời làm worker (phù hợp đồ án).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Budget memory cho 1 query phải < Xmx (1400m) trừ overhead Trino runtime
# (metadata cache, http server, iceberg planning…). Cấu hình dưới = ~70% Xmx.
query.max-memory=1GB
query.max-memory-per-node=900MB
# Thả lỏng 1 chút timeout query để gold layer join dim không bị cut nửa chừng.
query.client.timeout=10m
